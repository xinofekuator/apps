<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KOIRA — walk Nina, a rescued golden retriever puppy, through 3 days of streets and dog parks. Strategy, but fun.">
  <title>KOIRA · three days with Nina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-20X8RLX5BQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-20X8RLX5BQ');
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🐾</span>
        <span class="brand-title">
          <span>KOIRA</span>
          <span class="brand-sub">three days with Nina</span>
        </span>
      </div>
      <div class="topmeta">
        <span class="chip day-chip">Day <b>1/3</b></span>
        <span class="chip trust-chip">Trust <b>30</b></span>
        <span class="chip heart-chip">♥ <b>3</b></span>
        <span class="chip calm-chip">Calm <b>3</b></span>
        <span class="chip treat-chip">🦴 <b>3</b></span>
        <button class="btn ghost iconbtn" data-action="retry" title="Retry day (R)">↻</button>
        <button class="btn ghost iconbtn" data-action="mute" title="Mute (M)">🔊</button>
      </div>
    </header>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="game" width="420" height="360"></canvas>
        <div id="bubble" class="bubble hidden"></div>
        <div id="overlay" class="overlay hidden"></div>
      </div>
      <div id="encounterCard" class="card-stack"></div>
      <div id="upcomingRow" class="upcoming"></div>
      <div id="choiceRow" class="choice-row"></div>
      <div class="touchbar sub">
        <span class="touch-hint">1 LEAVE IT · 2 CROSS · 3 TREAT · S SCOUT · E ENTER · W WALK ON · B BRIBE</span>
      </div>
    </div>

    <footer class="hintbar">Visible queue = strategy. Calm is scarce. 0 hearts = day failed. 2 failed days = week over.<br><span style="opacity:.6">keys: 1 2 3 · S E W · B · R retry · M sound</span></footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
