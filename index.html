<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Small web apps built and shipped by Ignacio Amaya. Vanilla JS, static sites and utilities.">
  <title>Apps · Ignacio Amaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #3385FF;
      --accent-dark: #1f5fd6;
      --ink: #1c2434;
      --muted: #4b5563;
      --line: #e7eaec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f3f3f4;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
      padding: 104px 20px 56px;
    }
    .container { max-width: 1080px; margin: 0 auto; }

    /* minimal fixed navbar: back-link to the personal website */
    .backbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
    }
    .backbar .brand {
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .backbar .brand:hover { color: var(--accent); }
    .backbar .back {
      margin-left: auto;
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }
    .backbar .back:hover { color: var(--accent-dark); }

    /* heading + navy line (matches the Jekyll site section header) */
    .section-head { text-align: center; margin-bottom: 44px; }
    .section-head h1 {
      font-size: 30px; font-weight: 700; margin: 14px 0 0;
    }
    .section-head p {
      color: var(--muted); margin: 10px auto 0; max-width: 560px;
    }
    .navy-line {
      width: 60px; height: 2px; background: var(--accent);
      margin: 0 auto;
    }

    /* responsive card grid: 1 / 2 / 3 columns */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px)  { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(16,26,48,.04);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(51,133,255,.14);
    }
    .card-icon {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
    }
    .card h3 { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
    .card p {
      font-size: 15px; line-height: 1.55;
      color: var(--muted); margin: 0 0 20px;
      flex-grow: 1;
    }
    .card .try {
      display: inline-block;
      align-self: center;
      padding: 9px 20px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s ease;
    }
    .card .try:hover { background: var(--accent-dark); }

  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-20X8RLX5BQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-20X8RLX5BQ');
  </script>
</head>
<body>
  <div class="backbar">
    <a class="brand" href="https://ignacioamaya.com/">Ignacio Amaya</a>
    <a class="back" href="https://ignacioamaya.com/">← Back to website</a>
  </div>
  <div class="container">
    <div class="section-head">
      <p>Small webapps built by Ignacio.</p>
    </div>

    <div class="grid">
      <!-- One card per app. Copy this block and update name/desc/href to add an app. -->
      <div class="card">
        <div class="card-icon">🎮</div>
        <h3>SPRINTFIRE</h3>
        <p>Assign tasks and run a tiny dev team over six sprints to ship an arena FPS — with one hallucinating AI teammate. Don't let it launch buggy.</p>
        <a class="try" href="sprintfire/">Try it →</a>
      </div>
    </div>
  </div>
</body>
</html>
