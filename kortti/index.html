<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KORTTI — drive your first Finnish licence. Dodge summer traffic, survive the roundabout, and slide through winter night exams with an examiner who fails you no matter what.">
  <title>KORTTI · the pink licence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-20X8RLX5BQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-20X8RLX5BQ');
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🚘</span>
        <span class="brand-title">
          <span>KORTTI</span>
          <span class="brand-sub">the pink licence</span>
        </span>
      </div>
      <div class="topmeta">
        <span class="chip round-chip">Round <b>1</b>/3</span>
        <span class="chip month-chip">Kesä · Summer</span>
        <span class="chip attempt-chip">Attempt <b>1</b></span>
        <span class="chip score-chip">Points <b>100</b></span>
        <span class="chip speed-chip"><b>0</b> km/h</span>
        <button class="btn ghost iconbtn" data-action="retry" title="Retry (R)">↻</button>
        <button class="btn ghost iconbtn" data-action="pause" title="Pause (P)">⏸</button>
        <button class="btn ghost iconbtn" data-action="mute" title="Mute (M)">🔊</button>
      </div>
    </header>

    <div class="stage-wrap">
      <div class="stage">
        <canvas id="game" width="420" height="720"></canvas>
        <div id="bubble" class="bubble hidden"></div>
        <div id="overlay" class="overlay hidden"></div>
        <div class="touch-boost">
          <button id="boostBtn" class="btn boost-btn" title="Hold to boost, tap to lock answer">↑ HOLD BOOST · TAP TO LOCK</button>
        </div>
        <div class="touch-steer">
          <button class="steer-btn" data-steer="-1" aria-label="Left">‹</button>
          <button class="steer-btn" data-steer="1" aria-label="Right">›</button>
        </div>
      </div>
      <div class="touchbar">
        <button class="btn ghost" data-action="retry2" title="Retry">↻ Retry</button>
        <span class="touch-hint">tap road ← → to steer · hold ↑ to boost</span>
      </div>
    </div>

    <footer class="hintbar">tap road ← → to steer · hold <b>↑ HOLD BOOST</b> · tap <b>↑ LOCK</b> in gate &nbsp;·&nbsp; <b>↻</b> retry &nbsp;·&nbsp; <b>⏸</b> pause · <b>🔊</b> sound<br><span style="opacity:.6">keyboard: ← → · hold ↑ · tap ↑ · R · P · M</span></footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
